[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "doctosheet"
version = "0.1.0"
description = "Turn invoices and receipts into spreadsheets, locally: e-invoice XML, PDF text and OCR, with every value traced to its source."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Since AI ry", email = "builders@sinceai.fi" }]
keywords = ["invoice", "receipt", "pdf", "ocr", "spreadsheet", "xlsx", "e-invoice", "factur-x", "zugferd", "peppol"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Financial and Insurance Industry",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
  "pdfplumber>=0.11",
  "pypdfium2>=4.30",
  "pypdf>=5.0",
  "openpyxl>=3.1",
  "python-stdnum>=1.20",
  "defusedxml>=0.7",
  "lxml>=5.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "pillow>=10.0",
]

[project.optional-dependencies]
ocr = ["rapidocr>=3.4", "onnxruntime>=1.18"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "httpx>=0.27", "pyarrow>=15", "reportlab>=4.0"]

[project.scripts]
doctosheet = "doctosheet.cli:main"

[project.urls]
Homepage = "https://github.com/sinceaihq/doctosheet"
Issues = "https://github.com/sinceaihq/doctosheet/issues"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/README.md", "/LICENSE", "/NOTICE", "/CHANGELOG.md"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
